name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v0.1.0). No release is published."
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - run: go test ./...

      - name: Resolve version
        id: version
        run: echo "value=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: scripts/build-release.sh "${{ steps.version.outputs.value }}"

      - uses: actions/upload-artifact@v7
        with:
          name: agentrun-openai-${{ steps.version.outputs.value }}
          path: dist/

      # Only tag pushes publish; workflow_dispatch stops at the artifact above.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.value }}" \
            --title "${{ steps.version.outputs.value }}" \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS
