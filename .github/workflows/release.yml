name: release

# Manual only: no push, tag or schedule trigger. The run creates the tag
# itself, so nothing has to be tagged beforehand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.1.0. This run creates the tag."
        required: true
      dry_run:
        description: "Build the archives only: no tag, no release."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::version must look like v1.2.3 or v1.2.3-rc.1, got '$VERSION'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - run: go test ./...

      - name: Build binaries
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/build-release.sh "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: agentrun-openai-${{ inputs.version }}
          path: dist/

      # Runs last on purpose: the tag is created by `gh release create`, so a
      # failed build leaves no tag or release behind.
      - name: Tag and publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS
